<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Letian Deng — 3D Card</title>
    <meta
      name="description"
      content="Interactive 3D floating card island — Letian Deng's business card. Drag to rotate, scroll or pinch to zoom, and flip between the front and the back."
    />
    <meta name="theme-color" content="#efe4f6" />
    <link rel="canonical" href="https://dengletian702-rgb.github.io/letian-card-3d/" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Letian Deng — 3D Card" />
    <meta
      property="og:description"
      content="Drag, zoom, and flip Letian Deng's 3D floating card island."
    />
    <meta property="og:url" content="https://dengletian702-rgb.github.io/letian-card-3d/" />
    <meta property="og:image" content="https://dengletian702-rgb.github.io/letian-card-3d/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Letian Deng — 3D Card" />
    <meta
      name="twitter:description"
      content="Drag, zoom, and flip Letian Deng's 3D floating card island."
    />
    <meta name="twitter:image" content="https://dengletian702-rgb.github.io/letian-card-3d/og.jpg" />
  </head>
  <body>
    <div id="app">
      <canvas id="view" aria-label="Letian Deng 3D business card. Drag to rotate."></canvas>
      <p id="hint">
        <span lang="zh-CN">拖拽旋转 · 滚轮或双指缩放 · 双击翻转</span>
        <span class="hint-en">Drag to rotate · Scroll or pinch to zoom · Double-tap to flip</span>
      </p>
      <button id="flip" type="button" aria-label="Flip the card">
        <span lang="zh-CN">翻转</span>
        <span class="flip-en">Flip</span>
      </button>
      <footer>
        <span>Letian Deng · AI · <span lang="zh-CN">营销</span> · <span lang="zh-CN">设计</span></span>
        <a href="https://github.com/dengletian702-rgb/letian-card-3d">GitHub</a>
      </footer>
      <div id="loading" role="status" aria-live="polite">
        <img id="poster" alt="" src="%BASE_URL%og.jpg" />
        <div class="loading-panel">
          <p id="loading-label" lang="zh-CN">加载中</p>
          <div class="track" aria-hidden="true"><div id="bar"></div></div>
        </div>
      </div>
    </div>
    <noscript>
      <p>This card needs JavaScript and WebGL. / 此名片需要 JavaScript 与 WebGL。</p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
